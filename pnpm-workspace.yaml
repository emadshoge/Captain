packages:
  - 'apps/*'
  - 'packages/*'

# Expo supports pnpm isolated installs from SDK 54 (Expo monorepo guide).
# Keep pnpm's default isolated linker unless a React Native library forces
# `nodeLinker: hoisted` (record the reason in docs/decisions.md if so).

# Fail installs on any lifecycle script that is not explicitly allowed.
onlyBuiltDependencies:
  - esbuild

# Do not let pnpm pick "latest" for missing peers: in the Expo app that pulled
# in react-dom 19.3.0, react-native-worklets 0.13.0 and @react-native/metro-config
# 0.87.1, all mismatched with Expo SDK 57. Required peers are declared
# explicitly at the versions Expo SDK 57 pins.
autoInstallPeers: false
