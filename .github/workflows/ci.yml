name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI-only credentials for the service container.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Schema drift (Drizzle schema vs committed migrations)
        run: |
          pnpm --filter @captain/db exec drizzle-kit generate --name drift_check
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "Schema and migrations are out of sync. Run: pnpm --filter @captain/db db:generate" >&2
            git status --porcelain packages/db/migrations >&2
            exit 1
          fi
      - name: Test (PostgreSQL 16 service)
        run: pnpm test
      - name: Build (API, IoT gateway, Next.js apps)
        run: pnpm build

  mobile:
    name: Expo config, bundles, doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Resolves app config and exports Android + iOS JS bundles.
      # This is NOT a native build; native builds require EAS (not configured yet).
      - name: Expo config and JS bundle export
        run: pnpm mobile:check
      - name: Expo doctor
        run: pnpm --filter @captain/rider-mobile run doctor

  e2e:
    name: Web E2E (Playwright, real API + PostgreSQL, simulated devices)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI-only credentials for the service container.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (API, worker, gateway, rider web)
        run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm --filter @captain/rider-web exec playwright install --with-deps chromium
      - name: Rider web E2E
        run: pnpm --filter @captain/rider-web run e2e
      - name: Staff web E2E (includes operator-cannot-do-admin checks)
        run: pnpm --filter @captain/staff-web run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/rider-web/playwright-report
            apps/rider-web/test-results
            apps/staff-web/playwright-report
            apps/staff-web/test-results
          retention-days: 7

  resilience:
    name: Failure drills and load smoke test (simulated devices)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI-only credentials for the service container.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API and worker
        run: pnpm --filter @captain/api build
      - name: Failure drills
        run: pnpm --filter @captain/api drills
      - name: Staging rehearsal (staging config, least-privilege DB user, SMTP over STARTTLS, simulated gateway)
        run: |
          pnpm --filter @captain/iot-gateway build
          pnpm --filter @captain/api staging-rehearsal
      - name: Backup and restore drill (pg_dump / pg_restore 16, matching the server)
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends postgresql-client-16
          PATH="/usr/lib/postgresql/16/bin:$PATH" pnpm --filter @captain/api backup-drill
      - name: Load smoke test (short; full run is documented in docs/performance.md)
        run: pnpm --filter @captain/api perf
        env:
          PERF_DURATION_SECONDS: '20'
          PERF_SCOOTERS: '150'
          PERF_RIDERS: '50'
          PERF_RIDING: '20'

  images:
    name: Container images (build and smoke test; not pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI-only credentials for the service container.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -f docker/node-service.Dockerfile --build-arg APP=api -t captain-api:ci .
          docker build -f docker/node-service.Dockerfile --build-arg APP=iot-gateway -t captain-iot-gateway:ci .
          docker build -f docker/web.Dockerfile --build-arg APP=rider-web --build-arg NEXT_PUBLIC_API_URL=http://localhost:3000 -t captain-rider-web:ci .
          docker build -f docker/web.Dockerfile --build-arg APP=staff-web --build-arg NEXT_PUBLIC_API_URL=http://localhost:3000 -t captain-staff-web:ci .
      - name: Smoke test images
        env:
          DB: postgres://postgres:postgres@localhost:5432/captain_smoke
        run: |
          set -euo pipefail
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'create database captain_smoke'
          docker run --rm --network host -e APP_ENV=development -e DATABASE_URL="$DB" captain-api:ci node dist/cli/migrate.js
          docker run -d --name api --network host -e APP_ENV=development -e DATABASE_URL="$DB" captain-api:ci
          docker run -d --name worker --network host -e APP_ENV=development -e DATABASE_URL="$DB" captain-api:ci node dist/worker.js
          docker run -d --name gateway --network host -e APP_ENV=development -e DEVICE_ADAPTER=simulated captain-iot-gateway:ci node dist/main.js
          docker run -d --name rider-web --network host -e PORT=3001 captain-rider-web:ci
          docker run -d --name staff-web --network host -e PORT=3002 captain-staff-web:ci
          for url in http://localhost:3000/ready http://localhost:3100/health http://localhost:3001/sign-in http://localhost:3002/sign-in; do
            for i in $(seq 1 30); do curl -fsS "$url" > /dev/null && break; sleep 1; done
            curl -fsS "$url" > /dev/null && echo "ok $url"
          done
          test "$(docker inspect -f '{{.State.Running}}' worker)" = true
          # The production guard refuses fake/simulated providers at startup.
          if docker run --rm -e APP_ENV=production -e DATABASE_URL="$DB" -e PAYMENT_PROVIDER=fake captain-api:ci; then
            echo 'production guard did not stop the API' && exit 1
          fi
          echo 'production guard ok'
      - name: Staging kit smoke test (docker compose with these images; Caddyfile validated, no certificates)
        run: bash deploy/staging/ci-smoke.sh ci
      - name: Container logs on failure
        if: failure()
        run: for c in api worker gateway rider-web staff-web; do echo "== $c"; docker logs "$c" 2>&1 | tail -50 || true; done
